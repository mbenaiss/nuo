name: Installer

on:
  push:
    branches: [main]
    paths: ["install.sh", "scripts/install.sh", "deploy/**", ".github/workflows/install.yml"]
  pull_request:
    paths: ["install.sh", "scripts/install.sh", "deploy/**", ".github/workflows/install.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh scripts/install.sh

  dry-run:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # /bin/bash is bash 3.2 on macOS: the installer must run with it.
      - name: Dry run of this commit
        env:
          NUO_INSTALL_REPO: file://${{ github.workspace }}
          NUO_INSTALL_REF: ${{ github.sha }}
        run: /bin/bash install.sh --yes --dry-run
      - name: Nothing was written
        run: |
          for p in "$HOME/nuo" "$HOME/.secrets/nuo.env" "$HOME/.local/share/nuo" "$HOME/.config/systemd/user/nuo-gateway.service" "$HOME/Library/LaunchAgents/local.nuo.gateway.plist"; do
            if [ -e "$p" ]; then echo "dry run wrote $p"; exit 1; fi
          done
